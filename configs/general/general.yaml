general:
  experiment: "loclic"
  main_path: "path/to/loc-lic-new"
  dataset: "path/to/dataset/images"
  config: "loclic"
train:
  dataset_csv: "train_256"
  seed: 192
  epochs: 200
  learning_rate: 0.0001
  num_workers: 16
  lmbda: 0.01
  lmbda2: 1
  batch_size: 40
  test_batch_size: 40
  aux_learning_rate: 0.001
  patch_size: [256, 256] # [512, 512]
  cuda: True
  save: True
  clip_max_norm: 1.0
  checkpoint: None
  world_size: 1
  dist_url: "env://"
  dist_backend: "nccl"
  mixed_precision: "no"
  save_every: 1
test: 
  test_dataset: "kodak"
  batch_size: 1
  checkpoint: "path/to/loc-lic-new/checkpoints"
  output_dir: "path/to/loc-lic-new/outputs"
  lmbda: 0.01 # To calculate the loss
  lmbda2: 1 # To calculate the loss